name: Actualizar radar

on:
  schedule:
    - cron: "17 6 * * *"      # todos los días a las 06:17 UTC (≈ 7:17 en Madrid)
  push:
    paths: ["config.yaml", "plantilla.html", "radar.py"]
  workflow_dispatch:           # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python radar.py
      - name: Guardar cambios
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Radar actualizado $(date -u +%F)"
          git push
