name: Diagnostico
on:
  push:
    branches: [diagnostico]
    paths: ["diag/urls.txt","diag/diag.py"]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests beautifulsoup4
      - run: python diag/diag.py
      - run: |
          git config user.name radar-bot; git config user.email radar-bot@users.noreply.github.com
          git add diag; git commit -qm "diag resultados"; git push
