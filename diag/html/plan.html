ada en el registro comercial: HRA 115934\u003c/br\u003e\nTribunal de registro: Amtsgericht München\u003c/br\u003e\nContacto del agente de protección de datos: \u003ca href=\"mailto\u0026#58;privacy@personio.com\"\u003eprivacy@personio.com\u003c/a\u003e\u003c/br\u003e\n\n\u003ch3\u003eRegistros de acceso (“registros del servidor”)\u003c/h3\u003e\nCada acceso a este sitio web de reclutamiento activa automáticamente la recopilación de datos de protocolo generales, los llamados registros del servidor. Por norma general, estos datos son pseudónimos y, por tanto, no permiten inferir la identidad de una persona.\nSin estos datos, en algunos casos, sería técnicamente imposible transmitir o mostrar el contenido del software. Por otro lado, el tratamiento de los datos es absolutamente necesario por motivos de seguridad. En particular, para controlar el acceso, la introducción, la transferencia y el almacenamiento. Además, esta información anónima se puede utilizar con fines estadísticos y para optimizar los servicios y la tecnología. Asimismo, los archivos de registro se pueden comprobar y analizar de forma retrospectiva cuando existan sospechas de un uso ilegítimo del software. Base legal: § 25, subsección 2, apartado 2 de la TDDDG (la ley alemana de protección de datos en telecomunicaciones y servicios digitales).\nEn general, se recopilan datos como el nombre de dominio del sitio web, el navegador web y la versión del navegador web, el sistema operativo, la dirección IP y la marca de tiempo del acceso al software. El ámbito de este proceso de registro no excede el ámbito de registro común de cualquier otro sitio de la web.\nEstos registros de acceso se guardan durante un periodo máximo de 7 días. No existe el derecho a oponerse a ello.\n\n\u003ch3\u003eRegistros de errores\u003c/h3\u003e\nLos llamados registros de errores se generan para identificar errores y corregirlos. Es un procedimiento absolutamente necesario para poder reaccionar con la mayor agilidad posible a los problemas relativos a la visualización y la implementación del contenido (interés legítimo). Por norma general, estos datos son pseudónimos y, por tanto, no permiten inferir la identidad de una persona. Base legal: § 25, subsección 2, apartado 2 de la TDDDG (la ley alemana de protección de datos en telecomunicaciones y servicios digitales).\nCuando se genera un mensaje de error, se recopilan datos generales como el nombre de dominio del sitio web, el navegador web y la versión del navegador web, el sistema operativo, la dirección IP, la marca de tiempo del mensaje de error generado o la especificación.\nEstos registros de errores se guardan durante un periodo máximo de 7 días. No existe el derecho a oponerse a ello.\n\n\u003ch3\u003eUso de cookies\u003c/h3\u003e\nLas llamadas cookies se usan en ciertas partes de este sitio web de reclutamiento. Son pequeños archivos de texto que se almacenan en el dispositivo desde el que accedes al sitio web de reclutamiento. Por norma general, las cookies sirven para garantizar el acceso al sitio web (“absolutamente necesario”), implementar ciertas funcionalidades como los ajustes de idioma estándar (“funcional”), mejorar la experiencia de usuario o el rendimiento del sitio web (“rendimiento”) o colocar anuncios segmentados (“marketing”). \nEn este sitio web de reclutamiento, en general, solo utilizamos las cookies absolutamente necesarias, funcionales o de rendimiento. En particular, para implementar ajustes predeterminados como el idioma, para identificar el canal de anuncio de los empleos, o para analizar el rendimiento de un anuncio de un empleo a través del que un usuario ha accedido a este sitio web de reclutamiento. El uso de cookies es absolutamente necesario para proporcionar nuestros servicios y, por tanto, para el cumplimiento del contrato (artículo 6 (1) b) del RGPD).\nPeriodo de almacenamiento: hasta 1 mes o hasta el fin de la sesión en el navegador\nDerecho de oposición: puedes determinar en los ajustes del navegador si permites el uso de cookies o te opones a él. Desactivar las cookies puede ocasionar la limitación o el bloqueo completo de las funcionalidades de este sitio web de reclutamiento.\n\n\u003ch3\u003eDerechos de los interesados\u003c/h3\u003e\nSi Personio SE \u0026 Co. KG, como responsable del tratamiento, trata datos personales, tú, como parte interesada en relación con los datos, ostentas ciertos derechos en virtud del capítulo III del Reglamento General de Protección de Datos (RGPD)de la UE, dependiendo de la base legal y el propósito del tratamiento, en particular, el derecho de acceso (artículo 15 del RGPD) y los derechos de rectificación (artículo 16 del RGPD), supresión (artículo 17 del RGPD), limitación del tratamiento (artículo 18 del RGPD) y portabilidad de datos (artículo 20 del RGPD), así como el derecho de oposición (artículo 21 del RGPD). Si los datos personales se tratan con tu consentimiento, tienes derecho a retirar este consentimiento en virtud del artículo 7 III del RGPD.\nPara ejercer tus derechos como parte interesada en relación con los datos que se tratan con el fin de gestionar este sitio web de reclutamiento, dirígete al agente de protección de datos de Personio SE \u0026 Co. KG (véase el elemento B).\n\n\u003ch3\u003eDisposiciones finales\u003c/h3\u003e\nPersonio se reserva el derecho a ajustar esta declaración de privacidad de datos en cualquier momento para garantizar que cumpla siempre los requisitos legales vigentes o para aplicar cambios en los servicios ofrecidos (por ejemplo, cuando se introduzcan servicios nuevos). En este caso, se aplica la declaración de privacidad de datos nueva a cualquier visita al sitio web de reclutamiento posterior o a cualquier candidatura de empleo posterior.17:[\"$\",\"$L19\",null,{\"jobs\":[],\"subdomain\":\"plan-international\",\"summaryElement\":[\"$\",\"div\",null,{}],\"t\":{\"career-page.general.label-jobs-at\":\"Trabajos en {{company}}\",\"career-page.general.position-title\":\"{{positionName}} | Tr
