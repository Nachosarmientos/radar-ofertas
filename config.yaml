# ============================================================
#  RADAR DE OFERTAS · archivo de configuración
#  Es el único archivo que tienes que editar.
#  Tras guardar, el radar se regenera solo en unos minutos.
# ============================================================

# --- Cómo se ve tu página -----------------------------------
titulo: "Radar de Ofertas"
subtitulo: "Cooperación internacional, gestión de proyectos e impacto social"
color: "#0075C3"          # color principal (hexadecimal)
idioma: "es"              # es | en

# --- Qué buscar ---------------------------------------------
# La oferta entra si su título o descripción contiene
# AL MENOS UNA de estas palabras. No importan tildes, mayúsculas
# ni las formas /a, /o ("técnico" encuentra "técnica/o").
# Termina una palabra en * para aceptar variantes:
#   proyect*  → proyecto, proyectos, project…
palabras_clave:
  - proyect*
  - programme officer
  - programme manager
  - program manager
  - program officer
  - cooperación
  - desarrollo internacional
  - acción humanitaria
  - subvenci*
  - justificación
  - grants
  - alianzas
  - captación de fondos
  - fundraising
  - impacto social

# La oferta se descarta si contiene CUALQUIERA de estas.
excluir:
  - prácticas
  - voluntari*
  - becari*
  - intern
  - internship
  - trainee
  - volunteer
  - trabajador social
  - psicólog*
  - abogad*
  - profesor
  - orientación laboral
  - intermediación laboral
  - inclusión social
  - door to door
  - captación de socios
  - auditoría
  - evaluación final

# Solo se guardan ofertas publicadas (o vistas por primera vez)
# en los últimos N días.
dias_maximos: 45

# --- Dónde buscar -------------------------------------------
# Activa o desactiva cada fuente con  activa: true / false
#
# Tipos de fuente:
#   enlaces  → lee una página y toma los enlaces cuyo destino
#              contiene el "patron" (una expresión regular).
#   rss      → cualquier feed RSS o Atom (incluido Google Alerts).
#   fiiapp   → lector especial para la tabla de FIIAPP.
#   reliefweb→ API de ReliefWeb (necesita un appname gratuito).
fuentes:

  # ---------- Portales y bolsas del sector ----------
  - nombre: La Coordinadora
    tipo: enlaces
    activa: true
    url: "https://coordinadoraongd.org/empleo/"
    patron: "/empleo/ofertas/[^/]+/?$"

  - nombre: FIIAPP
    tipo: fiiapp
    activa: true
    url: "https://www.fiap.gob.es/ofertas/"
    lugar: "Madrid"

  - nombre: AEFundraising
    tipo: enlaces
    activa: true
    url: "https://www.aefundraising.org/empleo/"
    patron: "aefundraising\\.org/empleo/[^/]+/?$"
    excluir_patron: "/empleo/feed"

  - nombre: UAM Oficina Solidaria
    tipo: enlaces
    activa: true
    url: "https://www.uam.es/uam/oficinasolidaria/empleo-tercer-sector"
    patron: "(empleo-tercer-sector/|ofertas-empleo-)[a-z0-9-]+$"

  - nombre: Impactpool
    tipo: enlaces
    activa: true
    url: "https://www.impactpool.org/countries/Spain"
    patron: "/jobs/\\d+$"

  - nombre: PCDN
    tipo: enlaces
    activa: true
    url: "https://jobs.pcdn.global/"
    patron: "/jobs/[a-z0-9-]+-[0-9a-f]{8}$"

  # ---------- Organizaciones ----------
  - nombre: MPDL
    tipo: enlaces
    activa: true
    url: "https://movimiento-por-la-paz.careers.ats.bizneo.cloud/jobs"
    patron: "/jobs/(?!trabaja-en)[a-z0-9-]+$"
    entidad: "Movimiento por la Paz"

  - nombre: Provivienda
    tipo: enlaces
    activa: true
    url: "https://empleo.provivienda.org/jobs"
    patron: "/jobs/[a-z0-9-]+$"
    entidad: "Provivienda"

  - nombre: Acción contra el Hambre
    tipo: enlaces
    activa: true
    url: "https://employ.acf-e.org/"
    patron: "/positions/view/\\d+"
    entidad: "Acción contra el Hambre"

  - nombre: Mundubat
    tipo: enlaces
    activa: true
    url: "https://www.mundubat.org/empleo-2/"
    patron: "/empleo-oferta/[^/]+/?$"
    entidad: "Mundubat"

  - nombre: ActionAid
    tipo: enlaces
    activa: true
    url: "https://actionaid-espana.careers.ats.bizneo.cloud/jobs"
    patron: "/jobs/[a-z0-9-]+$"
    entidad: "ActionAid / Alianza por la Solidaridad"

  - nombre: Entreculturas
    tipo: enlaces
    activa: true
    url: "https://entreculturas.factorial.es/"
    patron: "/job_posting/"
    entidad: "Entreculturas"

  - nombre: Oxfam Intermón
    tipo: enlaces
    activa: true
    url: "https://empleo-sede.oxfamintermon.org/jobs"
    patron: "/jobs/[a-z0-9-]+$"
    entidad: "Oxfam Intermón"

  - nombre: OEI
    tipo: rss
    activa: true
    url: "https://empleo.oei.int/jobs.rss"

  - nombre: Plan International
    tipo: enlaces
    activa: true
    url: "https://plan-international.jobs.personio.com/?language=es"
    patron: "/job/\\d+"
    entidad: "Plan International España"

  - nombre: Cruz Roja
    tipo: enlaces
    activa: true
    url: "https://cruzroja.epreselec.com/Ofertas/Ofertas.aspx"
    patron: "lbMostrarOferta"
    enlace_listado: true      # sus ofertas se abren desde el listado
    entidad: "Cruz Roja Española"

  # ---------- Con código de acceso ----------
  # ReliefWeb bloquea su web a los programas; su API es la vía oficial.
  # Pide un "appname" gratuito en https://apidoc.reliefweb.int/parameters#appname
  - nombre: ReliefWeb
    tipo: reliefweb
    activa: false
    appname: "PEGA-AQUI-TU-APPNAME"
    paises: ["Spain"]       # vacío [] = todos los países
    limite: 100

  # ---------- Feeds RSS propios ----------
  # Google Alerts → crea una alerta → "Mostrar opciones" →
  # Enviar a: "Feed RSS" → copia la URL del icono RSS.
  # Sirve para cubrir portales que no se dejan leer (InfoJobs, Indeed,
  # Hacesfalta, Idealist…): por ejemplo, una alerta con
  #   site:hacesfalta.org "técnico de proyectos" Madrid
  - nombre: Google Alerts · cooperación
    tipo: rss
    activa: false
    url: "https://www.google.com/alerts/feeds/XXXXXXXX/XXXXXXXX"
